name: Build Vulkan speech runtime
on:
  push:
    branches: [main]
    paths: ['native/vulkan/**', '.github/workflows/vulkan-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-vulkan:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
          path: build/native-source/whisper-vulkan
      - name: Install official Vulkan SDK on the build runner
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.328.1/windows/vulkansdk-windows-X64-1.4.328.1.exe' -OutFile $installer
          $sdk = Join-Path $env:RUNNER_TEMP 'vulkan-sdk'
          $process = Start-Process -FilePath $installer -ArgumentList @('--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Vulkan SDK installer failed' }
          "VULKAN_SDK=$sdk" | Add-Content $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: |
          $header = Get-ChildItem $env:VULKAN_SDK -Recurse -Filter vulkan_core.h | Select-Object -First 1
          $library = Get-ChildItem $env:VULKAN_SDK -Recurse -Filter vulkan-1.lib | Where-Object { $_.FullName -notmatch 'Lib32' } | Select-Object -First 1
          if (!$header -or !$library) {
            Get-ChildItem $env:VULKAN_SDK -Directory -Recurse | Select-Object -First 35 -ExpandProperty FullName
            throw 'Vulkan SDK headers or x64 import library are missing'
          }
          $include = $header.Directory.Parent.FullName
          cmake -S native/vulkan -B build/vulkan-compiled "-DWHISPER_SOURCE=$((Get-Location).Path.Replace('\','/'))/build/native-source/whisper-vulkan" "-DVulkan_INCLUDE_DIR=$include" "-DVulkan_LIBRARY=$($library.FullName)" -A x64
      - name: Compile
        run: cmake --build build/vulkan-compiled --config Release --parallel 4 --target sayitem-vulkan whisper-cli
      - name: Package ordinary native libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/vulkan-runtime | Out-Null
          Get-ChildItem build/vulkan-compiled -Recurse -Filter *.dll | Copy-Item -Destination build/vulkan-runtime
          Copy-Item build/vulkan-compiled/bin/Release/whisper-cli.exe build/vulkan-runtime
          Copy-Item build/native-source/whisper-vulkan/LICENSE build/vulkan-runtime/whisper-MIT.txt
          'SayItem bridge ${{ github.sha }}; whisper.cpp d1be6fde11ac6e0407606b4e42fe72d34add8037; Vulkan SDK 1.4.328.1' | Set-Content build/vulkan-runtime/source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-windows-x64
          path: build/vulkan-runtime/
