name: Build bundled native speech
on:
  push:
    branches: [main]
    paths: ['native/ct2/**', '.github/workflows/native-build.yml']
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OpenNMT/CTranslate2
          ref: 5de572ef60b67a0276c5989ee73d0072808ff4c3
          path: build/native-source/ctranslate2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python native/ct2/prepare.py ${{ matrix.platform }} build/ct2-deps
      - shell: bash
        run: cmake -S native/ct2 -B build/ct2-deps/compiled -DCMAKE_BUILD_TYPE=Release "-DCT2_DEPS=$GITHUB_WORKSPACE/build/ct2-deps" "-DCT2_SOURCE=$GITHUB_WORKSPACE/build/native-source/ctranslate2" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build/ct2-deps/compiled --config Release --parallel 4
      - run: python native/ct2/prepare.py ${{ matrix.platform }} build/ct2-deps --package build/native-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native-artifact/
