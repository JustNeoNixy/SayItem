name: Build bundled native speech
on:
  push:
    branches: ['codex/native-cancellation']
    paths: ['native/**', '.github/workflows/native-build.yml']
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            extension: dll
          - os: ubuntu-22.04
            platform: linux-x64
            extension: so
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            extension: so
          - os: macos-15-intel
            platform: macos-x64
            extension: dylib
          - os: macos-latest
            platform: macos-arm64
            extension: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GiviMAD/whisper-jni
          ref: 1b537f459d299d5c3ce4e12306aceac75009c253
          submodules: recursive
          path: build/native-source/whisper-jni
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - shell: bash
        run: cmake -S native -B build/native-compiled -DCMAKE_BUILD_TYPE=Release "-DWHISPER_JNI_SOURCE=$GITHUB_WORKSPACE/build/native-source/whisper-jni" "-DSAYITEM_JDK=$JAVA_HOME"
      - run: cmake --build build/native-compiled --config Release --parallel 4 --target sayitem-whisper
      - shell: bash
        run: cmake "-DINPUT_FILE=$GITHUB_WORKSPACE/build/native-compiled/output/sayitem-whisper.${{ matrix.extension }}" "-DOUTPUT_DIR=$GITHUB_WORKSPACE/build/native-artifact" "-DPLATFORM=${{ matrix.platform }}" -P native/package.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native-artifact/
