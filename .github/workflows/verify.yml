name: Verify SayItem
on: [push, pull_request, workflow_dispatch]
jobs:
  mod:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build '-Pminecraft_version=${{ matrix.minecraft }}' --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sayitem-mc${{ matrix.minecraft }}
          path: build/libs/*.jar
  speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6-Essentials==6.10.2
      - run: python -m unittest discover -s speech -v
        env:
          QT_QPA_PLATFORM: offscreen
