name: Verify SayItem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  mod:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/model-source
          key: ct2-base-d01c3014881c-vad-4cbf549b
      - uses: actions/cache@v4
        with:
          path: build/test-runtime-cache
          key: speech-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/sayitem-speech/runtime-index.json') }}
      - run: python tools/fetch_speech_models.py
      - run: bash gradlew build verifySingleJar '-Pminecraft_version=${{ matrix.minecraft }}' '-Pspeech_model_dir=${{ github.workspace }}/build/model-source' --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sayitem-mc${{ matrix.minecraft }}
          path: build/libs/*.jar
  native-speech:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/model-source
          key: ct2-base-d01c3014881c-vad-4cbf549b
      - uses: actions/cache@v4
        with:
          path: build/test-runtime-cache
          key: speech-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/sayitem-speech/runtime-index.json') }}
      - run: python tools/fetch_speech_models.py
      - run: bash gradlew test --tests 'dev.sayitem.speech.*' '-Pspeech_model_dir=${{ github.workspace }}/build/model-source' --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: speech-test-failure-${{ matrix.os }}
          path: build/test-results/test/*.xml
