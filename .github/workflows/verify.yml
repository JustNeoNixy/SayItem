name: Verify SayItem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  mod:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/generated/speech-resources
          key: whisper-base-q5-422f1ae452ade6f3
      - run: bash gradlew build verifySingleJar '-Pminecraft_version=${{ matrix.minecraft }}' --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sayitem-mc${{ matrix.minecraft }}
          path: build/libs/*.jar
  native-speech:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/generated/speech-resources
          key: whisper-base-q5-422f1ae452ade6f3
      - run: bash gradlew test --tests 'dev.sayitem.speech.*' --console=plain
